services:
  minio:
    # Last published official community image used for local development only.
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/macau_mystery.db
      APP_ENV: development
      OBJECT_STORAGE_ENABLED: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_PRESIGN_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: macau-media
      S3_REGION: us-east-1
      S3_ADDRESSING_STYLE: path
      MEDIA_PUBLIC_BASE_URL: http://localhost:9000/macau-media
      MEDIA_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend:/app
      - backend_sqlite_data:/app/data
    depends_on:
      - minio
    command: sh -c "python -m app.storage_cli init && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  backend_sqlite_data:
  minio_data:
